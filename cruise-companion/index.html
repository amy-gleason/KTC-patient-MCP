<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12324f">
<title>Memories — Alaska Cruise</title>
<style>
  /* ============================================================
     Design system — matched to the family "Alaska Cruise" app:
     deep navy→teal header with a wavy divider, bold system sans,
     teal accents, green success, amber "Heads up" callouts,
     white rounded cards, and teal date chips.
     ============================================================ */
  :root {
    --bg: #eef2f5;
    --surface: #ffffff;
    --surface-2: #eaf1f4;       /* chip / input fill */
    --border: #e0e7ec;
    --text: #274050;            /* body ink */
    --heading: #12324f;         /* navy titles */
    --muted: #5f7d8c;           /* uppercase labels, sublines */
    --accent: #2b7d91;          /* teal — links, names, icons, active */
    --accent-strong: #23788d;   /* teal action button */
    --accent-deep: #1c6072;     /* button hover */
    --green: #2f9d67;           /* shared / success */
    --amber-bg: #fdf4e2;
    --amber-border: #e2a83a;
    --amber-text: #8a6330;
    --grad-a: #10314c;          /* header gradient */
    --grad-b: #256278;
    --shadow: 0 1px 3px rgba(18, 50, 79, 0.08), 0 6px 18px rgba(18, 50, 79, 0.06);
    --shadow-lg: 0 14px 40px rgba(18, 50, 79, 0.22);
    --radius: 16px;
    --radius-sm: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1a25;
      --surface: #11242f;
      --surface-2: #16303c;
      --border: #21414f;
      --text: #d6e4ec;
      --heading: #eaf3f8;
      --muted: #8fabb9;
      --accent: #59b5c9;
      --accent-strong: #2b8ba1;
      --accent-deep: #237687;
      --green: #47b982;
      --amber-bg: #33291a;
      --amber-border: #caa04a;
      --amber-text: #e7c98a;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
      --shadow-lg: 0 16px 44px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1a25; --surface: #11242f; --surface-2: #16303c; --border: #21414f;
    --text: #d6e4ec; --heading: #eaf3f8; --muted: #8fabb9;
    --accent: #59b5c9; --accent-strong: #2b8ba1; --accent-deep: #237687; --green: #47b982;
    --amber-bg: #33291a; --amber-border: #caa04a; --amber-text: #e7c98a;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
    --shadow-lg: 0 16px 44px rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; color: var(--heading); font-weight: 800; letter-spacing: -0.01em; }
  img, video { max-width: 100%; display: block; }
  button { font-family: inherit; }

  /* ---------- Header ---------- */
  header {
    position: relative;
    background: linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 100%);
    color: #fff;
    padding: calc(env(safe-area-inset-top) + 22px) 20px 40px;
  }
  .head-inner { max-width: 760px; margin: 0 auto; }
  .overline {
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255,255,255,0.72); margin-bottom: 10px;
  }
  .head-row { display: flex; align-items: center; gap: 12px; }
  h1 { color: #fff; font-size: clamp(26px, 7.5vw, 36px); line-height: 1.1; flex: 1; min-width: 0; text-wrap: balance; }
  .tagline { margin: 8px 0 0; font-size: 15px; color: rgba(255,255,255,0.85); }
  .mode-pill {
    flex: none; display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.24);
  }
  .mode-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #f0c36a; }
  .mode-pill.shared .dot { background: #6ee2a0; }
  .wave { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 34px; display: block; }
  .wave path { fill: var(--bg); }

  /* ---------- Layout ---------- */
  main { max-width: 760px; margin: 0 auto; padding: 18px 16px 128px; }

  .section-head { display: flex; align-items: center; gap: 10px; margin: 8px 2px 6px; }
  .section-head .ico { width: 22px; height: 22px; color: var(--accent); flex: none; }
  .section-head h2 { font-size: 22px; }
  .rule { border: 0; border-top: 1px solid var(--border); margin: 0 2px 18px; }

  /* ---------- Amber "Heads up" callout ---------- */
  .callout {
    background: var(--amber-bg); border: 1px solid var(--amber-border); border-left-width: 5px;
    border-radius: var(--radius-sm); padding: 13px 15px; margin: 0 0 18px;
    font-size: 14px; color: var(--amber-text);
  }
  .callout b { color: var(--amber-text); }
  .callout code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }

  /* ---------- Timeline ---------- */
  .timeline { display: flex; flex-direction: column; gap: 18px; }
  .memory {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .memory .media { background: var(--surface-2); line-height: 0; }
  .memory .media img { width: 100%; max-height: 66vh; object-fit: cover; cursor: zoom-in; }
  .memory .media video { width: 100%; max-height: 66vh; background: #000; }
  .memory .body { padding: 14px 16px 16px; }
  .mrow { display: flex; gap: 13px; align-items: flex-start; }
  .chip {
    flex: none; width: 52px; height: 56px; border-radius: 12px; background: var(--surface-2);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  }
  .chip .wd { font-size: 11px; font-weight: 800; letter-spacing: 0.04em; color: var(--accent); }
  .chip .dy { font-size: 22px; font-weight: 800; color: var(--heading); margin-top: 3px; }
  .mtext { min-width: 0; flex: 1; padding-top: 2px; }
  .memory h3 { font-size: 19px; line-height: 1.2; }
  .memory .who { font-size: 14px; font-weight: 700; color: var(--accent); margin-top: 3px; }
  .memory .story { font-size: 15.5px; color: var(--text); white-space: pre-wrap; word-wrap: break-word; margin-top: 11px; }
  .card-actions { margin-top: 12px; }
  .link-btn { background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; padding: 3px 2px; border-radius: 6px; }
  .link-btn:hover { color: #cc4747; text-decoration: underline; }

  /* ---------- Empty ---------- */
  .empty { text-align: center; padding: 46px 20px; color: var(--muted); }
  .empty .ico { width: 46px; height: 46px; color: var(--accent); margin: 0 auto 10px; }
  .empty h2 { font-size: 22px; margin-bottom: 6px; }
  .empty p { margin: 0 auto; max-width: 34ch; font-size: 15px; }

  /* ---------- Add button ---------- */
  .fab-wrap {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 14px);
    background: linear-gradient(to top, var(--bg) 58%, transparent); pointer-events: none;
  }
  .fab {
    pointer-events: auto; display: inline-flex; align-items: center; gap: 9px;
    background: var(--accent-strong); color: #fff; border: 0; border-radius: 999px;
    padding: 15px 26px; font-size: 17px; font-weight: 700; box-shadow: var(--shadow-lg);
    cursor: pointer; transition: transform 0.12s ease, background 0.12s ease;
  }
  .fab:hover { background: var(--accent-deep); }
  .fab:active { transform: scale(0.97); }
  .fab .plus { font-size: 22px; line-height: 1; margin-top: -2px; }

  /* ---------- Sheet ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 40; background: rgba(9, 20, 30, 0.55);
    display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(2px);
  }
  .scrim.open { display: flex; }
  .sheet {
    background: var(--surface); color: var(--text); width: 100%; max-width: 560px;
    border-radius: 22px 22px 0 0; max-height: 92vh; overflow-y: auto;
    padding: 8px 20px calc(env(safe-area-inset-bottom) + 24px);
    box-shadow: var(--shadow-lg); animation: rise 0.22s ease;
  }
  @media (min-width: 560px) { .scrim { align-items: center; } .sheet { border-radius: 22px; } }
  @keyframes rise { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 8px auto 8px; }
  .sheet h2 { font-size: 22px; margin: 6px 0 4px; }

  label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  input[type=text], textarea, input[type=date] {
    width: 100%; padding: 12px 14px; font-size: 16px; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit;
  }
  textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  .picker {
    border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 22px 16px;
    text-align: center; cursor: pointer; background: var(--surface-2); color: var(--muted); transition: border-color 0.15s;
  }
  .picker:hover { border-color: var(--accent); }
  .picker .ico { width: 34px; height: 34px; color: var(--accent); margin: 0 auto 6px; }
  .picker b { color: var(--heading); }
  .picker .hint { font-size: 13px; margin-top: 3px; }
  .preview { margin-top: 12px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
  .preview img, .preview video { width: 100%; max-height: 40vh; object-fit: contain; background: #000; }

  .field-row { display: flex; gap: 12px; }
  .field-row > div { flex: 1; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn { flex: 1; padding: 14px; font-size: 16px; font-weight: 700; border-radius: var(--radius-sm); cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--heading); }
  .btn.primary { background: var(--accent-strong); color: #fff; border-color: transparent; }
  .btn.primary:disabled { opacity: 0.55; cursor: default; }
  .btn.ghost { flex: 0 0 auto; }

  .backup-row { margin-top: 18px; text-align: center; font-size: 13px; color: var(--muted); }
  .link-inline { color: var(--accent); cursor: pointer; text-decoration: underline; background: none; border: 0; font: inherit; padding: 0; }

  /* ---------- Lightbox ---------- */
  .lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.93);
    display: none; align-items: center; justify-content: center; padding: 16px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-out; border-radius: 6px; }
  .lightbox .close { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 16px;
    background: rgba(255,255,255,0.15); color: #fff; border: 0; border-radius: 50%; width: 42px; height: 42px; font-size: 22px; cursor: pointer; }

  /* ---------- Toast ---------- */
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 92px);
    transform: translateX(-50%) translateY(12px); background: var(--heading); color: #fff;
    padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 70; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast { background: #0a1620; border: 1px solid var(--border); } }

  .spinner { width: 17px; height: 17px; border: 2.5px solid rgba(255,255,255,0.4); border-top-color: #fff;
    border-radius: 50%; display: inline-block; animation: spin 0.7s linear infinite; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="overline" id="overline">Alaska · Inside Passage</div>
    <div class="head-row">
      <h1 id="trip-title">Memories</h1>
      <button class="mode-pill" id="mode-pill" title="Where memories are saved">
        <span class="dot"></span><span id="mode-label">On this device</span>
      </button>
    </div>
    <p class="tagline" id="tagline">Photos, videos &amp; stories from the trip</p>
  </div>
  <svg class="wave" viewBox="0 0 1440 40" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,24 C240,44 480,6 720,16 C960,26 1200,44 1440,22 L1440,40 L0,40 Z"></path>
  </svg>
</header>

<main>
  <div class="section-head">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2l1.2-1.8A1 1 0 0 1 8.5 4.7h7a1 1 0 0 1 .83.5L17.5 7h2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/>
      <circle cx="12" cy="13" r="3.2"/>
    </svg>
    <h2>Memories</h2>
  </div>
  <hr class="rule">

  <div class="callout" id="notice" hidden><div id="notice-text"></div></div>
  <div id="timeline" class="timeline"></div>
</main>

<div class="fab-wrap">
  <button class="fab" id="add-btn"><span class="plus">＋</span> Add a memory</button>
</div>

<!-- Add sheet -->
<div class="scrim" id="scrim">
  <form class="sheet" id="sheet" autocomplete="off">
    <div class="grabber"></div>
    <h2>Add a memory</h2>

    <input type="file" id="file-input" accept="image/*,video/*" hidden>
    <div class="picker" id="picker">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2l1.2-1.8A1 1 0 0 1 8.5 4.7h7a1 1 0 0 1 .83.5L17.5 7h2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/>
        <circle cx="12" cy="13" r="3.2"/>
      </svg>
      <div><b>Add a photo or video</b></div>
      <div class="hint">Tap to choose or take one</div>
    </div>
    <div class="preview" id="preview" hidden></div>

    <label for="who">Your name</label>
    <input type="text" id="who" placeholder="e.g. Grandma Sue" maxlength="40">

    <div class="field-row">
      <div>
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Glacier Bay!" maxlength="80">
      </div>
      <div>
        <label for="when">Date</label>
        <input type="date" id="when">
      </div>
    </div>

    <label for="story">The story</label>
    <textarea id="story" placeholder="What happened? Who was there? What did it feel like?"></textarea>

    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="cancel-btn">Cancel</button>
      <button type="submit" class="btn primary" id="save-btn">Save memory</button>
    </div>

    <div class="backup-row">
      <button type="button" class="link-inline" id="backup-link">Save a backup file</button>
      &nbsp;·&nbsp;
      <button type="button" class="link-inline" id="restore-link">Restore from backup</button>
    </div>
    <input type="file" id="restore-input" accept="application/json,.json" hidden>
  </form>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="close" id="lightbox-close" aria-label="Close">✕</button>
  <img id="lightbox-img" alt="">
</div>

<div class="toast" id="toast"></div>

<!-- Optional shared-album config. Present => shared family album; missing => private on-device. -->
<script src="config.js" onerror="window.__noConfig=true"></script>

<script>
"use strict";
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
  }

  function parseDate(iso) {
    if (!iso) return null;
    const d = new Date(iso + (iso.length === 10 ? "T12:00:00" : ""));
    return isNaN(d) ? null : d;
  }
  function fmtChip(iso) {
    const d = parseDate(iso);
    if (!d) return { wd: "", dy: "" };
    return { wd: d.toLocaleDateString(undefined, { weekday: "short" }).toUpperCase(), dy: String(d.getDate()) };
  }
  function fmtLong(iso) {
    const d = parseDate(iso);
    return d ? d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }) : "";
  }
  function todayISO() {
    const d = new Date(); const off = d.getTimezoneOffset() * 60000;
    return new Date(d - off).toISOString().slice(0, 10);
  }

  // ---- Config ----
  const CFG = (!window.__noConfig && window.CRUISE_CONFIG) ? window.CRUISE_CONFIG : null;
  const SHARED = !!(CFG && CFG.supabaseUrl && CFG.supabaseAnonKey);
  if (CFG && CFG.tripTitle) { $("trip-title").textContent = CFG.tripTitle; document.title = CFG.tripTitle + " — Alaska Cruise"; }
  if (CFG && CFG.tagline) $("tagline").textContent = CFG.tagline;
  if (CFG && CFG.overline) $("overline").textContent = CFG.overline;

  // ---- On-device backend (IndexedDB) ----
  const LocalStore = (function () {
    const DB = "cruise-memories", STORE = "memories", VER = 1;
    let _db = null;
    function open() {
      return new Promise((res, rej) => {
        if (_db) return res(_db);
        const req = indexedDB.open(DB, VER);
        req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "id" }); };
        req.onsuccess = () => { _db = req.result; res(_db); };
        req.onerror = () => rej(req.error);
      });
    }
    function tx(mode) { return open().then((db) => db.transaction(STORE, mode).objectStore(STORE)); }
    return {
      async list() {
        const store = await tx("readonly");
        return new Promise((res, rej) => {
          const out = [];
          store.openCursor().onsuccess = (e) => { const c = e.target.result; if (c) { out.push(c.value); c.continue(); } else res(out.sort(sortMemories)); };
          store.transaction.onerror = () => rej(store.transaction.error);
        });
      },
      async add(rec, file) {
        rec.blob = file || null;
        const store = await tx("readwrite");
        return new Promise((res, rej) => { const r = store.put(rec); r.onsuccess = () => res(rec); r.onerror = () => rej(r.error); });
      },
      async remove(id) {
        const store = await tx("readwrite");
        return new Promise((res, rej) => { const r = store.delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
      },
      hydrate(rec) { if (rec.blob && !rec.mediaUrl) rec.mediaUrl = URL.createObjectURL(rec.blob); return rec; },
    };
  })();

  // ---- Shared backend (Supabase) ----
  const CloudStore = (function () {
    let client = null;
    async function getClient() {
      if (client) return client;
      const mod = await import("https://esm.sh/@supabase/supabase-js@2");
      client = mod.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
      return client;
    }
    const BUCKET = (CFG && CFG.bucket) || "media";
    const TABLE = (CFG && CFG.table) || "memories";
    return {
      async list() {
        const sb = await getClient();
        const { data, error } = await sb.from(TABLE).select("*").order("taken_at", { ascending: false }).order("created_at", { ascending: false });
        if (error) throw error;
        return (data || []).map((row) => ({
          id: row.id, title: row.title, story: row.story, who: row.who,
          takenAt: row.taken_at, createdAt: row.created_at, mediaType: row.media_type || "none",
          mediaUrl: row.media_path ? sb.storage.from(BUCKET).getPublicUrl(row.media_path).data.publicUrl : null,
          mediaPath: row.media_path,
        })).sort(sortMemories);
      },
      async add(rec, file) {
        const sb = await getClient();
        let media_path = null;
        if (file) {
          const ext = (file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "");
          const key = rec.id + "." + ext;
          const { error: upErr } = await sb.storage.from(BUCKET).upload(key, file, { cacheControl: "31536000", upsert: true, contentType: file.type || undefined });
          if (upErr) throw upErr;
          media_path = key;
        }
        const { error } = await sb.from(TABLE).insert({ id: rec.id, title: rec.title, story: rec.story, who: rec.who, taken_at: rec.takenAt, media_type: rec.mediaType, media_path });
        if (error) throw error;
        rec.mediaPath = media_path; return rec;
      },
      async remove(id) { const sb = await getClient(); const { error } = await sb.from(TABLE).delete().eq("id", id); if (error) throw error; },
      hydrate(rec) { return rec; },
    };
  })();

  const Store = SHARED ? CloudStore : LocalStore;
  function sortMemories(a, b) {
    const ka = (a.takenAt || "") + (a.createdAt || ""), kb = (b.takenAt || "") + (b.createdAt || "");
    return kb.localeCompare(ka);
  }

  function paintMode() {
    const pill = $("mode-pill"), notice = $("notice");
    if (SHARED) {
      pill.classList.add("shared"); $("mode-label").textContent = "Shared album"; notice.hidden = true;
    } else {
      $("mode-label").textContent = "On this device";
      $("notice-text").innerHTML =
        "<b>Heads up:</b> these memories are saved privately on this device and stay after you close the app. " +
        "To make one album the whole family adds to, turn on sharing (see <code>SETUP.md</code>). " +
        "Meanwhile, use <b>Save a backup file</b> now and then so nothing is lost.";
      notice.hidden = false;
    }
  }

  let MEMORIES = [];
  function render() {
    const wrap = $("timeline");
    if (!MEMORIES.length) {
      wrap.innerHTML = `
        <div class="empty">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2l1.2-1.8A1 1 0 0 1 8.5 4.7h7a1 1 0 0 1 .83.5L17.5 7h2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/>
            <circle cx="12" cy="13" r="3.2"/>
          </svg>
          <h2>No memories yet</h2>
          <p>Tap <b>＋ Add a memory</b> to drop in your first photo, video, or story from the cruise.</p>
        </div>`;
      return;
    }
    wrap.innerHTML = MEMORIES.map(cardHtml).join("");
    wrap.querySelectorAll("[data-zoom]").forEach((el) => el.addEventListener("click", () => openLightbox(el.getAttribute("data-zoom"))));
    wrap.querySelectorAll("[data-del]").forEach((el) => el.addEventListener("click", () => onDelete(el.getAttribute("data-del"))));
  }

  function cardHtml(m) {
    let media = "";
    if (m.mediaType === "image" && m.mediaUrl)
      media = `<div class="media"><img src="${esc(m.mediaUrl)}" alt="${esc(m.title || "memory")}" loading="lazy" data-zoom="${esc(m.mediaUrl)}"></div>`;
    else if (m.mediaType === "video" && m.mediaUrl)
      media = `<div class="media"><video src="${esc(m.mediaUrl)}" controls playsinline preload="metadata"></video></div>`;
    const chip = fmtChip(m.takenAt);
    const chipHtml = chip.dy ? `<div class="chip" title="${esc(fmtLong(m.takenAt))}"><span class="wd">${esc(chip.wd)}</span><span class="dy">${esc(chip.dy)}</span></div>` : "";
    const title = m.title ? esc(m.title) : (chip.dy ? "" : "Memory");
    return `
      <article class="memory">
        ${media}
        <div class="body">
          <div class="mrow">
            ${chipHtml}
            <div class="mtext">
              ${title ? `<h3>${title}</h3>` : ""}
              ${m.who ? `<div class="who">${esc(m.who)}</div>` : ""}
            </div>
          </div>
          ${m.story ? `<div class="story">${esc(m.story)}</div>` : ""}
          <div class="card-actions"><button class="link-btn" data-del="${esc(m.id)}">Remove</button></div>
        </div>
      </article>`;
  }

  // Lightbox
  function openLightbox(src) { $("lightbox-img").src = src; $("lightbox").classList.add("open"); }
  function closeLightbox() { $("lightbox").classList.remove("open"); $("lightbox-img").src = ""; }
  $("lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox" || e.target.id === "lightbox-img") closeLightbox(); });
  $("lightbox-close").addEventListener("click", closeLightbox);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeLightbox(); closeSheet(); } });

  // Sheet
  let pendingFile = null;
  function openSheet() { $("who").value = localStorage.getItem("cruise.who") || ""; $("when").value = todayISO(); $("scrim").classList.add("open"); document.body.style.overflow = "hidden"; }
  function closeSheet() { $("scrim").classList.remove("open"); document.body.style.overflow = ""; resetForm(); }
  function resetForm() { pendingFile = null; $("sheet").reset(); $("preview").hidden = true; $("preview").innerHTML = ""; $("picker").hidden = false; $("save-btn").disabled = false; $("save-btn").innerHTML = "Save memory"; }

  $("add-btn").addEventListener("click", openSheet);
  $("cancel-btn").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", (e) => { if (e.target.id === "scrim") closeSheet(); });
  $("picker").addEventListener("click", () => $("file-input").click());

  $("file-input").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    pendingFile = file;
    const url = URL.createObjectURL(file);
    const isVideo = (file.type || "").startsWith("video");
    $("preview").innerHTML = isVideo ? `<video src="${url}" controls playsinline></video>` : `<img src="${url}" alt="preview">`;
    $("preview").hidden = false; $("picker").hidden = true;
    if (!$("title").value) {
      const base = file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim();
      if (base && !/^(img|image|video|mov|photo|pxl|dsc)[\s\d]*$/i.test(base)) $("title").value = base.slice(0, 80);
    }
  });

  $("sheet").addEventListener("submit", onSave);
  async function onSave(e) {
    e.preventDefault();
    const who = $("who").value.trim(), title = $("title").value.trim(), story = $("story").value.trim();
    const takenAt = $("when").value || todayISO();
    if (!pendingFile && !title && !story) { toast("Add a photo, a title, or a story first"); return; }
    if (who) localStorage.setItem("cruise.who", who);
    let mediaType = "none";
    if (pendingFile) mediaType = (pendingFile.type || "").startsWith("video") ? "video" : "image";
    const rec = { id: cryptoId(), title, story, who, takenAt, createdAt: new Date().toISOString(), mediaType, mediaUrl: null };
    const btn = $("save-btn"); btn.disabled = true;
    btn.innerHTML = SHARED ? '<span class="spinner"></span> Uploading…' : '<span class="spinner"></span> Saving…';
    try {
      await Store.add(rec, pendingFile);
      closeSheet(); toast(SHARED ? "Shared with the family 🎉" : "Saved 🎉"); await load();
    } catch (err) {
      console.error(err); btn.disabled = false; btn.innerHTML = "Save memory"; toast("Couldn't save — " + friendlyError(err));
    }
  }

  function friendlyError(err) {
    const msg = (err && (err.message || err.error_description || err.error)) || "something went wrong";
    if (/quota|storage/i.test(msg)) return "this device is low on space";
    if (/Failed to fetch|network/i.test(msg)) return "no internet right now";
    if (/row-level security|policy|permission|401|403/i.test(msg)) return "the shared album isn't set up to allow adding yet";
    return msg;
  }
  function cryptoId() { if (crypto && crypto.randomUUID) return crypto.randomUUID(); return "m-" + Math.random().toString(36).slice(2) + Date.now().toString(36); }

  async function onDelete(id) {
    if (!confirm("Remove this memory? This can't be undone.")) return;
    try { await Store.remove(id); toast("Removed"); await load(); }
    catch (err) { console.error(err); toast("Couldn't remove — " + friendlyError(err)); }
  }

  // Backup / restore (on-device)
  $("backup-link").addEventListener("click", onBackup);
  $("restore-link").addEventListener("click", () => $("restore-input").click());
  $("restore-input").addEventListener("change", onRestore);
  async function onBackup() {
    try {
      const items = await LocalStore.list(); const out = [];
      for (const it of items) {
        let media = null; if (it.blob) media = { type: it.blob.type, dataUrl: await blobToDataUrl(it.blob) };
        out.push({ id: it.id, title: it.title, story: it.story, who: it.who, takenAt: it.takenAt, createdAt: it.createdAt, mediaType: it.mediaType, media });
      }
      const blob = new Blob([JSON.stringify({ app: "cruise-companion", version: 1, memories: out }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob); const a = document.createElement("a");
      a.href = url; a.download = "alaska-memories-backup-" + todayISO() + ".json"; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000); toast("Backup saved to your device");
    } catch (err) { console.error(err); toast("Couldn't make a backup — " + friendlyError(err)); }
  }
  async function onRestore(e) {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text()); const mems = (data && data.memories) || [];
      if (!Array.isArray(mems) || !mems.length) { toast("Nothing to restore in that file"); return; }
      let added = 0; const existing = new Set((await LocalStore.list()).map((m) => m.id));
      for (const m of mems) {
        if (existing.has(m.id)) continue;
        let blob = null; if (m.media && m.media.dataUrl) blob = await dataUrlToBlob(m.media.dataUrl);
        await LocalStore.add({ id: m.id, title: m.title, story: m.story, who: m.who, takenAt: m.takenAt, createdAt: m.createdAt, mediaType: m.mediaType, mediaUrl: null }, blob);
        added++;
      }
      toast(added ? `Restored ${added} ${added === 1 ? "memory" : "memories"}` : "Already up to date"); await load();
    } catch (err) { console.error(err); toast("That file couldn't be read"); }
    finally { e.target.value = ""; }
  }
  function blobToDataUrl(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }
  async function dataUrlToBlob(dataUrl) { return (await fetch(dataUrl)).blob(); }

  $("mode-pill").addEventListener("click", () => {
    if (SHARED) toast("Shared album — everyone with the link sees the same memories");
    else toast("Private to this device. See SETUP.md to share with family.");
  });

  async function load() {
    try {
      const items = await Store.list();
      MEMORIES = SHARED ? items : items.map((r) => LocalStore.hydrate(r));
      render();
    } catch (err) {
      console.error(err);
      $("timeline").innerHTML = `<div class="empty"><h2>Couldn't load memories</h2><p>${esc(friendlyError(err))}</p></div>`;
    }
  }

  paintMode(); load();
})();
</script>
</body>
</html>
