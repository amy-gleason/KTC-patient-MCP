<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<title>Our Alaska — Cruise Memories</title>
<style>
  /* ---------- Design tokens (light) ----------
     Harmonized with the family SHL viewer (navy #0b3d91) and given its own
     warm Alaska personality: glacier blues + one sunset-amber action color. */
  :root {
    --navy: #0b3d91;         /* shared accent with the viewer app */
    --navy-deep: #082963;
    --fjord: #0f2a3f;
    --glacier: #eaf2f6;
    --amber: #e8a24c;        /* the single bold action color */
    --amber-deep: #c9822f;

    --bg: #f4f8fb;           /* pale glacier ground */
    --surface: #ffffff;
    --surface-2: #eef4f8;
    --border: #d9e5ec;
    --text: #12222e;         /* fjord-tinted near-black */
    --muted: #5c7688;        /* slate with a blue bias */
    --shadow: 0 6px 20px rgba(15, 42, 63, 0.10);
    --shadow-lg: 0 14px 40px rgba(15, 42, 63, 0.18);
    --radius: 16px;
    --radius-sm: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1620;
      --surface: #132534;
      --surface-2: #0f1e2b;
      --border: #23394a;
      --text: #e7f0f6;
      --muted: #90a8b8;
      --glacier: #172c3d;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 44px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1620;
    --surface: #132534;
    --surface-2: #0f1e2b;
    --border: #23394a;
    --text: #e7f0f6;
    --muted: #90a8b8;
    --glacier: #172c3d;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 16px 44px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  img, video { max-width: 100%; display: block; }
  button { font-family: inherit; }

  /* ---------- Header ---------- */
  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--fjord) 100%);
    color: #fff;
    padding: calc(env(safe-area-inset-top) + 22px) 20px 24px;
    position: relative;
    overflow: hidden;
  }
  header::after { /* subtle glacier horizon */
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: linear-gradient(90deg, var(--amber), transparent 70%);
    opacity: 0.8;
  }
  .head-inner { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .head-text { flex: 1; min-width: 0; }
  h1 { margin: 0; font-size: clamp(22px, 6vw, 30px); text-wrap: balance; }
  .tagline { margin: 4px 0 0; font-size: 14px; opacity: 0.85; }
  .mode-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em;
    padding: 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.14); color: #fff;
    border: 1px solid rgba(255,255,255,0.22);
    cursor: pointer; white-space: nowrap;
  }
  .mode-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
  .mode-pill.shared .dot { background: #57d38c; }

  /* ---------- Layout ---------- */
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 120px; }

  .notice {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px; margin: 0 0 18px;
    font-size: 13.5px; color: var(--muted); display: flex; gap: 10px; align-items: flex-start;
  }
  .notice b { color: var(--text); }
  .notice .ico { flex: none; margin-top: 1px; }

  /* ---------- Timeline cards ---------- */
  .timeline { display: flex; flex-direction: column; gap: 20px; }
  .memory {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .memory .media {
    background: var(--surface-2); position: relative; line-height: 0;
  }
  .memory .media img { width: 100%; max-height: 68vh; object-fit: cover; cursor: zoom-in; }
  .memory .media video { width: 100%; max-height: 68vh; background: #000; }
  .memory .body { padding: 14px 16px 16px; }
  .memory h2 { margin: 0 0 4px; font-size: 19px; }
  .memory .meta {
    display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center;
    font-size: 13px; color: var(--muted); margin-bottom: 8px;
  }
  .memory .who { font-weight: 600; color: var(--navy); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .memory .who { color: #7fb0ff; } }
  :root[data-theme="dark"] .memory .who { color: #7fb0ff; }
  .memory .story { font-size: 15.5px; white-space: pre-wrap; word-wrap: break-word; }
  .memory .card-actions { margin-top: 12px; display: flex; gap: 8px; }
  .link-btn {
    background: none; border: 0; color: var(--muted); font-size: 13px;
    cursor: pointer; padding: 4px 2px; border-radius: 6px;
  }
  .link-btn:hover { color: #d64545; text-decoration: underline; }

  /* ---------- Empty state ---------- */
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty .berg { font-size: 46px; }
  .empty h2 { color: var(--text); margin: 12px 0 6px; font-size: 22px; }
  .empty p { margin: 0 auto; max-width: 34ch; font-size: 15px; }

  /* ---------- Add button (always visible) ---------- */
  .fab-wrap {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; justify-content: center;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 14px);
    background: linear-gradient(to top, var(--bg) 55%, transparent);
    pointer-events: none;
  }
  .fab {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--amber); color: #3a2404;
    border: 0; border-radius: 999px;
    padding: 15px 26px; font-size: 17px; font-weight: 700;
    box-shadow: var(--shadow-lg); cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .fab:hover { filter: brightness(1.04); }
  .fab:active { transform: scale(0.97); }
  .fab .plus { font-size: 22px; line-height: 1; margin-top: -2px; }

  /* ---------- Sheet / modal ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 40; background: rgba(9, 20, 30, 0.55);
    display: none; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .scrim.open { display: flex; }
  .sheet {
    background: var(--surface); color: var(--text);
    width: 100%; max-width: 560px;
    border-radius: 22px 22px 0 0;
    max-height: 92vh; overflow-y: auto;
    padding: 8px 20px calc(env(safe-area-inset-bottom) + 24px);
    box-shadow: var(--shadow-lg);
    animation: rise 0.22s ease;
  }
  @media (min-width: 560px) {
    .scrim { align-items: center; }
    .sheet { border-radius: 22px; }
  }
  @keyframes rise { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 8px auto 6px; }
  .sheet h2 { margin: 6px 0 16px; font-size: 22px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; letter-spacing: 0.01em; }
  input[type=text], textarea, input[type=date] {
    width: 100%; padding: 12px 14px; font-size: 16px; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-family: inherit;
  }
  textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
  input:focus, textarea:focus { outline: 2px solid var(--navy); outline-offset: 1px; border-color: transparent; }

  .picker {
    border: 2px dashed var(--border); border-radius: var(--radius-sm);
    padding: 22px 16px; text-align: center; cursor: pointer;
    background: var(--surface-2); color: var(--muted); transition: border-color 0.15s;
  }
  .picker:hover { border-color: var(--navy); }
  .picker .big { font-size: 30px; }
  .picker .hint { font-size: 13px; margin-top: 4px; }
  .preview { margin-top: 12px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
  .preview img, .preview video { width: 100%; max-height: 40vh; object-fit: contain; background: #000; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    flex: 1; padding: 14px; font-size: 16px; font-weight: 700; border-radius: var(--radius-sm);
    cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  }
  .btn.primary { background: var(--amber); color: #3a2404; border-color: transparent; }
  .btn.primary:disabled { opacity: 0.5; cursor: default; }
  .btn.ghost { flex: 0 0 auto; }

  .field-row { display: flex; gap: 12px; }
  .field-row > div { flex: 1; }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.92);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-out; border-radius: 6px; }
  .lightbox .close { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 16px;
    background: rgba(255,255,255,0.15); color: #fff; border: 0; border-radius: 50%;
    width: 42px; height: 42px; font-size: 22px; cursor: pointer; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 92px);
    transform: translateX(-50%) translateY(12px);
    background: var(--fjord); color: #fff; padding: 11px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 70;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .spinner {
    width: 18px; height: 18px; border: 2.5px solid rgba(58,36,4,0.35);
    border-top-color: #3a2404; border-radius: 50%; display: inline-block;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .settings-row { font-size: 13px; color: var(--muted); }
  .settings-row a, .link-inline { color: var(--navy); cursor: pointer; text-decoration: underline; background: none; border: 0; font: inherit; padding: 0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .settings-row a, :root:not([data-theme="light"]) .link-inline { color: #7fb0ff; } }
  :root[data-theme="dark"] .settings-row a, :root[data-theme="dark"] .link-inline { color: #7fb0ff; }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="head-text">
      <h1 id="trip-title">Our Alaska</h1>
      <p class="tagline" id="tagline">Photos, videos &amp; stories from the trip</p>
    </div>
    <button class="mode-pill" id="mode-pill" title="Where memories are saved">
      <span class="dot"></span><span id="mode-label">On this device</span>
    </button>
  </div>
</header>

<main>
  <div class="notice" id="notice" hidden>
    <span class="ico">💡</span>
    <div id="notice-text"></div>
  </div>
  <div id="timeline" class="timeline"></div>
</main>

<div class="fab-wrap">
  <button class="fab" id="add-btn"><span class="plus">＋</span> Add a memory</button>
</div>

<!-- Add / edit sheet -->
<div class="scrim" id="scrim">
  <form class="sheet" id="sheet" autocomplete="off">
    <div class="grabber"></div>
    <h2>Add a memory</h2>

    <input type="file" id="file-input" accept="image/*,video/*" hidden>
    <div class="picker" id="picker">
      <div class="big">📷</div>
      <div><b>Add a photo or video</b></div>
      <div class="hint">Tap to choose or take one</div>
    </div>
    <div class="preview" id="preview" hidden></div>

    <label for="who">Your name</label>
    <input type="text" id="who" placeholder="e.g. Grandma Sue" maxlength="40">

    <div class="field-row">
      <div>
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Glacier Bay!" maxlength="80">
      </div>
      <div>
        <label for="when">Date</label>
        <input type="date" id="when">
      </div>
    </div>

    <label for="story">The story</label>
    <textarea id="story" placeholder="What happened? Who was there? What did it feel like?"></textarea>

    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="cancel-btn">Cancel</button>
      <button type="submit" class="btn primary" id="save-btn">Save memory</button>
    </div>

    <div class="settings-row" style="margin-top:18px; text-align:center;">
      <button type="button" class="link-inline" id="backup-link">Save a backup file</button>
      &nbsp;·&nbsp;
      <button type="button" class="link-inline" id="restore-link">Restore from backup</button>
    </div>
    <input type="file" id="restore-input" accept="application/json,.json" hidden>
  </form>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="close" id="lightbox-close" aria-label="Close">✕</button>
  <img id="lightbox-img" alt="">
</div>

<div class="toast" id="toast"></div>

<!-- Optional shared-album configuration. If present, the app becomes a shared
     family album. If missing (404), the app runs privately on this device.
     See SETUP.md — your daughter fills this in once. -->
<script src="config.js" onerror="window.__noConfig=true"></script>

<script>
"use strict";
(function () {
  // ============================================================
  //  Small helpers
  // ============================================================
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 2600);
  }

  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso + (iso.length === 10 ? "T12:00:00" : ""));
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { weekday: "short", month: "long", day: "numeric" });
  }
  function todayISO() {
    const d = new Date();
    const off = d.getTimezoneOffset() * 60000;
    return new Date(d - off).toISOString().slice(0, 10);
  }

  // ============================================================
  //  Config — is a shared album wired up?
  // ============================================================
  const CFG = (!window.__noConfig && window.CRUISE_CONFIG) ? window.CRUISE_CONFIG : null;
  const SHARED = !!(CFG && CFG.supabaseUrl && CFG.supabaseAnonKey);
  if (CFG && CFG.tripTitle) { $("trip-title").textContent = CFG.tripTitle; document.title = CFG.tripTitle + " — Cruise Memories"; }
  if (CFG && CFG.tagline) $("tagline").textContent = CFG.tagline;

  // ============================================================
  //  Storage backends
  //  Both expose: list(), add(memory), remove(id)
  //  A "memory" record: { id, title, story, who, takenAt, createdAt,
  //                       mediaType: "image"|"video"|"none", mediaUrl }
  // ============================================================

  // ---- On-device backend (IndexedDB) ----
  const LocalStore = (function () {
    const DB = "cruise-memories", STORE = "memories", VER = 1;
    let _db = null;
    function open() {
      return new Promise((res, rej) => {
        if (_db) return res(_db);
        const req = indexedDB.open(DB, VER);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "id" });
        };
        req.onsuccess = () => { _db = req.result; res(_db); };
        req.onerror = () => rej(req.error);
      });
    }
    function tx(mode) { return open().then((db) => db.transaction(STORE, mode).objectStore(STORE)); }
    return {
      async list() {
        const store = await tx("readonly");
        return new Promise((res, rej) => {
          const out = [];
          store.openCursor().onsuccess = (e) => {
            const cur = e.target.result;
            if (cur) { out.push(cur.value); cur.continue(); }
            else res(out.sort(sortMemories));
          };
          store.transaction.onerror = () => rej(store.transaction.error);
        });
      },
      async add(rec, file) {
        // Store the media blob directly; build an object URL for display.
        rec.blob = file || null;
        const store = await tx("readwrite");
        return new Promise((res, rej) => {
          const r = store.put(rec);
          r.onsuccess = () => res(rec);
          r.onerror = () => rej(r.error);
        });
      },
      async remove(id) {
        const store = await tx("readwrite");
        return new Promise((res, rej) => {
          const r = store.delete(id);
          r.onsuccess = () => res();
          r.onerror = () => rej(r.error);
        });
      },
      // Rehydrate object URLs each session (they don't persist across reloads).
      hydrate(rec) {
        if (rec.blob && !rec.mediaUrl) rec.mediaUrl = URL.createObjectURL(rec.blob);
        return rec;
      },
    };
  })();

  // ---- Shared backend (Supabase) ----
  const CloudStore = (function () {
    let client = null;
    async function getClient() {
      if (client) return client;
      const mod = await import("https://esm.sh/@supabase/supabase-js@2");
      client = mod.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
      return client;
    }
    const BUCKET = (CFG && CFG.bucket) || "media";
    const TABLE = (CFG && CFG.table) || "memories";
    return {
      async list() {
        const sb = await getClient();
        const { data, error } = await sb.from(TABLE).select("*").order("taken_at", { ascending: false }).order("created_at", { ascending: false });
        if (error) throw error;
        return (data || []).map((row) => ({
          id: row.id,
          title: row.title, story: row.story, who: row.who,
          takenAt: row.taken_at, createdAt: row.created_at,
          mediaType: row.media_type || "none",
          mediaUrl: row.media_path
            ? sb.storage.from(BUCKET).getPublicUrl(row.media_path).data.publicUrl
            : null,
          mediaPath: row.media_path,
        })).sort(sortMemories);
      },
      async add(rec, file) {
        const sb = await getClient();
        let media_path = null;
        if (file) {
          const ext = (file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "");
          const key = rec.id + "." + ext;
          const { error: upErr } = await sb.storage.from(BUCKET).upload(key, file, {
            cacheControl: "31536000", upsert: true, contentType: file.type || undefined,
          });
          if (upErr) throw upErr;
          media_path = key;
        }
        const { error } = await sb.from(TABLE).insert({
          id: rec.id, title: rec.title, story: rec.story, who: rec.who,
          taken_at: rec.takenAt, media_type: rec.mediaType, media_path,
        });
        if (error) throw error;
        rec.mediaPath = media_path;
        return rec;
      },
      async remove(id) {
        const sb = await getClient();
        // Best-effort: remove the row (media file is left; harmless).
        const { error } = await sb.from(TABLE).delete().eq("id", id);
        if (error) throw error;
      },
      hydrate(rec) { return rec; },
    };
  })();

  const Store = SHARED ? CloudStore : LocalStore;

  function sortMemories(a, b) {
    const ka = (a.takenAt || "") + (a.createdAt || "");
    const kb = (b.takenAt || "") + (b.createdAt || "");
    return kb.localeCompare(ka);
  }

  // ============================================================
  //  Mode UI
  // ============================================================
  function paintMode() {
    const pill = $("mode-pill");
    const notice = $("notice");
    if (SHARED) {
      pill.classList.add("shared");
      $("mode-label").textContent = "Shared album";
      notice.hidden = true;
    } else {
      $("mode-label").textContent = "On this device";
      $("notice-text").innerHTML =
        "<b>These memories are saved privately on this device.</b> They stay even after you close the app. " +
        "To let the whole family add to one album, your daughter can turn on sharing in a few minutes " +
        "(see <code>SETUP.md</code>). Meanwhile, tap <b>＋ Add a memory</b> and use <b>Save a backup file</b> now and then to keep them safe.";
      notice.hidden = false;
    }
  }

  // ============================================================
  //  Render timeline
  // ============================================================
  let MEMORIES = [];

  function render() {
    const wrap = $("timeline");
    if (!MEMORIES.length) {
      wrap.innerHTML = `
        <div class="empty">
          <div class="berg">🧊</div>
          <h2>No memories yet</h2>
          <p>Tap <b>＋ Add a memory</b> to drop in your first photo, video, or story from the cruise.</p>
        </div>`;
      return;
    }
    wrap.innerHTML = MEMORIES.map(cardHtml).join("");
    // Wire up per-card actions
    wrap.querySelectorAll("[data-zoom]").forEach((el) =>
      el.addEventListener("click", () => openLightbox(el.getAttribute("data-zoom"))));
    wrap.querySelectorAll("[data-del]").forEach((el) =>
      el.addEventListener("click", () => onDelete(el.getAttribute("data-del"))));
  }

  function cardHtml(m) {
    let media = "";
    if (m.mediaType === "image" && m.mediaUrl) {
      media = `<div class="media"><img src="${esc(m.mediaUrl)}" alt="${esc(m.title || "memory")}" loading="lazy" data-zoom="${esc(m.mediaUrl)}"></div>`;
    } else if (m.mediaType === "video" && m.mediaUrl) {
      media = `<div class="media"><video src="${esc(m.mediaUrl)}" controls playsinline preload="metadata"></video></div>`;
    }
    const when = fmtDate(m.takenAt);
    const meta = [
      m.who ? `<span class="who">${esc(m.who)}</span>` : "",
      when ? `<span>${esc(when)}</span>` : "",
    ].filter(Boolean).join("");
    return `
      <article class="memory">
        ${media}
        <div class="body">
          ${m.title ? `<h2>${esc(m.title)}</h2>` : ""}
          ${meta ? `<div class="meta">${meta}</div>` : ""}
          ${m.story ? `<div class="story">${esc(m.story)}</div>` : ""}
          <div class="card-actions">
            <button class="link-btn" data-del="${esc(m.id)}">Remove</button>
          </div>
        </div>
      </article>`;
  }

  // ============================================================
  //  Lightbox
  // ============================================================
  function openLightbox(src) {
    $("lightbox-img").src = src;
    $("lightbox").classList.add("open");
  }
  function closeLightbox() {
    $("lightbox").classList.remove("open");
    $("lightbox-img").src = "";
  }
  $("lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox" || e.target.id === "lightbox-img") closeLightbox(); });
  $("lightbox-close").addEventListener("click", closeLightbox);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeLightbox(); closeSheet(); } });

  // ============================================================
  //  Add sheet
  // ============================================================
  let pendingFile = null;

  function openSheet() {
    $("who").value = localStorage.getItem("cruise.who") || "";
    $("when").value = todayISO();
    $("scrim").classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeSheet() {
    $("scrim").classList.remove("open");
    document.body.style.overflow = "";
    resetForm();
  }
  function resetForm() {
    pendingFile = null;
    $("sheet").reset();
    $("preview").hidden = true;
    $("preview").innerHTML = "";
    $("picker").hidden = false;
    $("save-btn").disabled = false;
    $("save-btn").innerHTML = "Save memory";
  }

  $("add-btn").addEventListener("click", openSheet);
  $("cancel-btn").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", (e) => { if (e.target.id === "scrim") closeSheet(); });
  $("picker").addEventListener("click", () => $("file-input").click());

  $("file-input").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    pendingFile = file;
    const url = URL.createObjectURL(file);
    const isVideo = (file.type || "").startsWith("video");
    $("preview").innerHTML = isVideo
      ? `<video src="${url}" controls playsinline></video>`
      : `<img src="${url}" alt="preview">`;
    $("preview").hidden = false;
    $("picker").hidden = true;
    // Prefill title from filename if empty
    if (!$("title").value) {
      const base = file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim();
      if (base && !/^(img|image|video|mov|photo|pxl|dsc)[\s\d]*$/i.test(base)) $("title").value = base.slice(0, 80);
    }
  });

  $("sheet").addEventListener("submit", onSave);

  async function onSave(e) {
    e.preventDefault();
    const who = $("who").value.trim();
    const title = $("title").value.trim();
    const story = $("story").value.trim();
    const takenAt = $("when").value || todayISO();

    if (!pendingFile && !title && !story) {
      toast("Add a photo, a title, or a story first");
      return;
    }
    if (who) localStorage.setItem("cruise.who", who);

    let mediaType = "none";
    if (pendingFile) mediaType = (pendingFile.type || "").startsWith("video") ? "video" : "image";

    const rec = {
      id: cryptoId(),
      title, story, who,
      takenAt,
      createdAt: new Date().toISOString(),
      mediaType,
      mediaUrl: null,
    };

    const btn = $("save-btn");
    btn.disabled = true;
    btn.innerHTML = SHARED ? '<span class="spinner"></span> Uploading…' : '<span class="spinner"></span> Saving…';

    try {
      await Store.add(rec, pendingFile);
      closeSheet();
      toast(SHARED ? "Shared with the family 🎉" : "Saved 🎉");
      await load();
    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btn.innerHTML = "Save memory";
      toast("Couldn't save — " + friendlyError(err));
    }
  }

  function friendlyError(err) {
    const msg = (err && (err.message || err.error_description || err.error)) || "something went wrong";
    if (/quota|storage/i.test(msg)) return "this device is low on space";
    if (/Failed to fetch|network/i.test(msg)) return "no internet right now";
    if (/row-level security|policy|permission|401|403/i.test(msg)) return "the shared album isn't set up to allow adding yet";
    return msg;
  }

  function cryptoId() {
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
    return "m-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  async function onDelete(id) {
    if (!confirm("Remove this memory? This can't be undone.")) return;
    try {
      await Store.remove(id);
      toast("Removed");
      await load();
    } catch (err) {
      console.error(err);
      toast("Couldn't remove — " + friendlyError(err));
    }
  }

  // ============================================================
  //  Backup / restore (on-device mode)
  // ============================================================
  $("backup-link").addEventListener("click", onBackup);
  $("restore-link").addEventListener("click", () => $("restore-input").click());
  $("restore-input").addEventListener("change", onRestore);

  async function onBackup() {
    try {
      const items = await LocalStore.list();
      const out = [];
      for (const it of items) {
        let media = null;
        if (it.blob) media = { type: it.blob.type, dataUrl: await blobToDataUrl(it.blob) };
        out.push({
          id: it.id, title: it.title, story: it.story, who: it.who,
          takenAt: it.takenAt, createdAt: it.createdAt, mediaType: it.mediaType, media,
        });
      }
      const blob = new Blob([JSON.stringify({ app: "cruise-companion", version: 1, memories: out }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "alaska-memories-backup-" + todayISO() + ".json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("Backup saved to your device");
    } catch (err) {
      console.error(err);
      toast("Couldn't make a backup — " + friendlyError(err));
    }
  }

  async function onRestore(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const mems = (data && data.memories) || [];
      if (!Array.isArray(mems) || !mems.length) { toast("Nothing to restore in that file"); return; }
      let added = 0;
      const existing = new Set((await LocalStore.list()).map((m) => m.id));
      for (const m of mems) {
        if (existing.has(m.id)) continue;
        let blob = null;
        if (m.media && m.media.dataUrl) blob = await dataUrlToBlob(m.media.dataUrl);
        await LocalStore.add({
          id: m.id, title: m.title, story: m.story, who: m.who,
          takenAt: m.takenAt, createdAt: m.createdAt, mediaType: m.mediaType, mediaUrl: null,
        }, blob);
        added++;
      }
      toast(added ? `Restored ${added} ${added === 1 ? "memory" : "memories"}` : "Already up to date");
      await load();
    } catch (err) {
      console.error(err);
      toast("That file couldn't be read");
    } finally {
      e.target.value = "";
    }
  }

  function blobToDataUrl(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.readAsDataURL(blob);
    });
  }
  async function dataUrlToBlob(dataUrl) { return (await fetch(dataUrl)).blob(); }

  // ============================================================
  //  Mode pill → quick explainer
  // ============================================================
  $("mode-pill").addEventListener("click", () => {
    if (SHARED) toast("Shared album — everyone with the link sees the same memories");
    else toast("Private to this device. See SETUP.md to share with family.");
  });

  // ============================================================
  //  Load
  // ============================================================
  async function load() {
    try {
      const items = await Store.list();
      MEMORIES = SHARED ? items : items.map((r) => LocalStore.hydrate(r));
      render();
    } catch (err) {
      console.error(err);
      $("timeline").innerHTML =
        `<div class="empty"><div class="berg">⚓</div><h2>Couldn't load memories</h2><p>${esc(friendlyError(err))}</p></div>`;
    }
  }

  paintMode();
  load();
})();
</script>
</body>
</html>
